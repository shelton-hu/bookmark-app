<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾页 · 扩展设置</title><link rel="icon" type="image/png" href="icons/icon-32.png"><link rel="stylesheet" href="options.css"></head>
<body><main><header><img class="mark" src="icons/icon-128.png" width="52" height="52" alt=""><div><h1>拾页 · 收藏入口</h1><p>点击工具栏图标打开确认面板，确认后保存并自动同步。</p></div></header>
<section><h2>连接你的收藏夹</h2><form id="settings"><label for="server">NAS 服务地址</label><input id="server" type="url" placeholder="http://192.168.1.10:8093" required><label for="token">扩展访问令牌</label><input id="token" type="password" autocomplete="off" required><p class="hint">在 Web 管理界面的访问令牌设置中创建，可随时撤销。</p><label class="check"><input id="send-excerpt" type="checkbox" checked>发送正文节选（最多 12,000 字符）</label><p class="hint">开启后正文节选会保存在 NAS，并发送给你配置的分类和向量模型服务。关闭后仅发送网址、标题和描述。</p><div class="actions"><button type="submit">保存设置</button><button id="test" type="button" class="secondary">测试连接</button><a id="web-link" target="_blank" rel="noopener noreferrer" hidden>打开管理页面 ↗</a></div></form><p id="status" role="status" aria-live="polite"></p></section>
<section><div class="section-heading"><h2>待同步收藏 <span id="count"></span></h2><button id="sync" class="secondary">立即同步</button></div><p class="hint">服务器确认收到后才算已保存。关闭浏览器不会丢失队列；启动后及每分钟自动重试。</p><p id="last-error" role="status"></p><ul id="queue"></ul></section>
<section><h2>最近同步</h2><p class="hint">已保存的标题、备注和分类可以在 Web 管理页面修改。</p><ul id="recent"></ul></section></main><script type="module" src="options.js"></script></body></html>

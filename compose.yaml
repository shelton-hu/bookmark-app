services:
  bookmark:
    build: .
    image: bookmark-app:local
    restart: unless-stopped
    ports:
      - "${BOOKMARK_BIND:-0.0.0.0}:${BOOKMARK_PORT:-8093}:8000"
    environment:
      DATA_DIR: /data
    volumes:
      - "${BOOKMARK_DATA_DIR:-./data}:/data"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
